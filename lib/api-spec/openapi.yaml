openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: restaurants
    description: Budget-safe restaurant discovery and import operations
  - name: outreach
    description: Outreach preferences and automation
  - name: replies
    description: Protected inbound outreach reply classification
  - name: gmail
    description: Gmail watch renewal and authenticated Pub/Sub push
  - name: rewards
    description: Authenticated diner reward balances and activity
  - name: osm-candidates
    description: Admin-controlled OSM candidate review, claim, rights, and publication workflow
paths:
  /rewards:
    get:
      operationId: getRewards
      tags: [rewards]
      summary: Get the signed-in diner's reward balance and recent earnings
      responses:
        "200":
          description: Current points balance and recent reward events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsResponse"
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Rewards are temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cities:
    get:
      operationId: listCities
      tags: [restaurants]
      summary: List canonical restaurant cities
      responses:
        "200":
          description: Cities ordered by restaurant count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitySummary"
  /dashboard/health:
    servers: [{ url: / }]
    get:
      operationId: getDashboardHealth
      tags: [health]
      security: [{ automationBearer: [] }]
      summary: Read bounded process-local scraper health without launching scans
      responses:
        "200":
          description: Score is null when there are no samples today in UTC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardHealth" }
        "401":
          description: Invalid automation credential
  /dashboard/operations/ingestion-diagnostic:
    get:
      operationId: getIngestionOutreachDiagnostic
      tags: [health]
      security: [{ adminSession: [] }]
      summary: Read stored city import, restaurant, candidate, and outreach outcomes
      description: Today means since 00:00 UTC. Excludes contact details and message content.
      responses:
        "200":
          description: Admin-only, database-backed diagnostic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionOutreachDiagnostic" }
        "401":
          description: Admin session required
        "503":
          description: Diagnostic database query failed
  /dashboard/operations/government-sources:
    get:
      operationId: getGovernmentSourceReadiness
      tags: [restaurants]
      security: [{ adminSession: [] }]
      summary: Read the paused, budgeted government-data pilot plan
      responses:
        "200":
          description: Pilot schedule and sources; billing is not measured by this API
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernmentSourceReadiness" }
        "401": { description: Admin session required }
  /dashboard/operations/government-sources/preview:
    post:
      operationId: previewGovernmentSource
      tags: [restaurants]
      security: [{ adminSession: [] }]
      summary: Fetch one bounded read-only page from a selected official source
      description: Does not write to the database, publish listings, or contact Google or AI services.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GovernmentSourcePreviewInput" }
      responses:
        "200":
          description: Normalized sample and validation totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovernmentSourcePreview" }
        "400": { description: Invalid source or page size }
        "401": { description: Admin session required }
        "429": { description: Preview rate limit reached }
        "503": { description: Official source unavailable or returned invalid data }
  /dashboard/status:
    servers: [{ url: / }]
    get:
      operationId: getDashboardStatus
      tags: [restaurants]
      security: [{ automationBearer: [] }]
      summary: Aggregate current workflow counts from stored outreach states
      responses:
        "200":
          description: Scraped and inserted are milestones and are not counted as stored outreach states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStatusCounts" }
        "401":
          description: Invalid automation credential
        "503":
          description: Counts could not be read
  /dashboard/errors:
    servers: [{ url: / }]
    get:
      operationId: getDashboardErrors
      tags: [health]
      security: [{ automationBearer: [] }]
      summary: Error category counts from the bounded current-process event buffer
      responses:
        "200":
          description: Counts reset on restart; unrecognised categories appear under unknown
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, minimum: 0 }
        "401":
          description: Invalid automation credential
  /dashboard/summary:
    servers: [{ url: / }]
    get:
      operationId: getDashboardSummary
      tags: [health]
      security: [{ automationBearer: [] }]
      summary: Current status counts, scraper health score, and ten latest events
      responses:
        "200":
          description: Status counts are database totals; health and events are process-local
          content:
            application/json:
              schema:
                type: object
                required: [statusCounts, healthScore, recentEvents, healthScope]
                properties:
                  statusCounts: { $ref: "#/components/schemas/DashboardStatusCounts" }
                  healthScore: { type: [integer, "null"], minimum: 0, maximum: 100 }
                  healthScope: { type: string, enum: [current_process] }
                  recentEvents:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      required: [time, type, message]
                      properties:
                        time: { type: string, format: date-time }
                        type: { type: string }
                        message: { type: string }
                        category: { type: string }
        "401":
          description: Invalid automation credential
        "503":
          description: Summary could not be read
  /dashboard/restaurant-import/status:
    servers: [{ url: / }]
    get:
      operationId: getAdminRestaurantImportStatus
      tags: [restaurants]
      summary: Get restaurant import budget status for administrators
      responses:
        "200":
          description: Current budget and import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantImportStatus"
        "401":
          description: Admin login required
  /dashboard/restaurant-import/plan:
    servers: [{ url: / }]
    post:
      operationId: createAdminRestaurantImportPlan
      tags: [restaurants]
      summary: Preview a budget-safe restaurant import plan as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantImportPlanInput"
      responses:
        "200":
          description: Import plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantImportPlan"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin login required
  /dashboard/restaurant-import/run:
    servers: [{ url: / }]
    post:
      operationId: runAdminRestaurantImport
      tags: [restaurants]
      summary: Run a confirmed budget-capped restaurant import as an administrator
      description: Requires an admin session. Limited to five run requests per 15 minutes across both import run paths; every paid call also requires a budget reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantImportRunInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantImportRunResult"
        "400":
          description: Invalid or unconfirmed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin login required
        "429":
          description: Too many import runs
        "503":
          description: Google Places is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/events:
    servers:
      - url: /
    get:
      operationId: getDashboardEvents
      tags: [gmail]
      summary: Latest 200 process-local operational events, oldest first
      security:
        - automationBearer: []
      responses:
        "200":
          description: Events reset on server restart and are not shared between instances
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  type: object
                  required: [time, type, message]
                  properties:
                    time:
                      type: string
                      format: date-time
                    type:
                      type: string
                    message:
                      type: string
                    category:
                      type: string
                      description: Optional error category
        "401":
          description: Invalid automation credential
  /status/gmail-watch-status:
    servers:
      - url: /
    get:
      operationId: getGmailWatchStatus
      tags: [gmail]
      summary: Read saved Gmail Watch status without activating or renewing
      security:
        - automationBearer: []
      responses:
        "200":
          description: Saved watch status; active only means expiration is in the future
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                  hoursRemaining:
                    type: string
                    description: Hours until expiration, rounded to one decimal place
                  lastRenewedAt:
                    type: [string, "null"]
                    format: date-time
                  historyId:
                    type: string
                    description: Precision-safe Gmail processing history cursor
        "401":
          description: Invalid automation credential
        "503":
          description: Watch status could not be read
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /restaurant-import/status:
    get:
      operationId: getRestaurantImportStatus
      tags: [restaurants]
      summary: Get restaurant import budget status
      responses:
        "200":
          description: Current budget and import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantImportStatus"
  /restaurant-import/plan:
    post:
      operationId: createRestaurantImportPlan
      tags: [restaurants]
      summary: Preview a budget-safe import plan without contacting Google Places
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantImportPlanInput"
      responses:
        "200":
          description: Import plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantImportPlan"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restaurant-import/run:
    post:
      operationId: runRestaurantImport
      tags: [restaurants]
      deprecated: true
      summary: Legacy admin-only import alias (use /dashboard/restaurant-import/run)
      description: Requires an admin session. Limited to five run requests per 15 minutes across both import run paths; every paid call also requires a budget reservation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantImportRunInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantImportRunResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin login required
        "429":
          description: Too many import runs
        "503":
          description: Google Places is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      summary: List imported restaurants
      parameters:
        - in: query
          name: city
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Imported restaurants, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  /restaurants/nearby:
    get:
      operationId: listNearbyRestaurants
      tags: [restaurants]
      summary: List stored-coordinate restaurants near a device location
      description: >
        Returns only restaurants with coordinates already stored in the
        database. This endpoint never geocodes, calls a places provider, or
        fills missing coordinates.
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: longitude
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - in: query
          name: radiusMiles
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 25
            default: 5
      responses:
        "200":
          description: Nearby restaurants sorted by stored-coordinate distance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyRestaurantsResponse"
        "400":
          description: Invalid location or radius
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restaurants/{placeId}/claim:
    post:
      operationId: claimRestaurant
      tags: [restaurants]
      summary: Claim a free basic restaurant listing
      description: Requires a valid, unexpired claim link sent to the restaurant's business email. Paid verification and checkout are currently unavailable.
      parameters:
        - $ref: "#/components/parameters/PlaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantClaimInput"
      responses:
        "200":
          description: Free basic claim recorded, or an existing claim retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantClaimResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing, invalid, expired, or restaurant-mismatched claim link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Claim links are unavailable because secure server configuration is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /outreach/unsubscribe/{token}:
    post:
      operationId: unsubscribeRestaurantOutreach
      tags: [outreach]
      summary: Suppress all future outreach for a restaurant
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Suppression recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsubscribeResult"
        "404":
          description: Invalid unsubscribe token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /automation/outreach:
    post:
      operationId: runOutreachAutomation
      tags: [outreach]
      summary: Run one protected, daily outreach batch (maximum 20 delivery attempts)
      security:
        - automationBearer: []
      responses:
        "200":
          description: Automation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachRunResult"
        "401":
          description: Invalid automation credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Sending is disabled or configuration is unsafe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /replies/incoming:
    post:
      operationId: classifyIncomingReply
      tags: [replies]
      summary: Classify a supplied outreach reply and update its restaurant
      description: Classifies only the supplied body. It does not read or modify an email mailbox.
      security:
        - automationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncomingReplyInput"
      responses:
        "200":
          description: Reply classified and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyClassification"
        "400":
          description: Invalid or oversized request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid automation credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /automation/instantly/replies:
    post:
      operationId: pollInstantlyReplies
      tags: [replies]
      summary: Reconcile a bounded Instantly received-email inbox pass
      description: Requires explicit Instantly reply polling enablement, resumes a durable cursor, and accepts only durably mapped campaigns.
      security:
        - automationBearer: []
      responses:
        "200":
          description: Polling result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantlyReplyPollResult"
        "401":
          description: Invalid automation credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Polling disabled, unavailable, or unsafe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /automation/gmail/replies:
    post:
      operationId: pollGmailReplies
      tags: [replies, gmail]
      summary: Reconcile a bounded Gmail inbox pass against stored outbound threads
      description: Derives reply contents and restaurant ownership only from Gmail and durable outbound-thread mappings; callers cannot select either.
      security:
        - automationBearer: []
      responses:
        "200":
          description: Polling result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailReplyPollResult"
        "401":
          description: Invalid automation credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Gmail polling is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/renew-gmail-watch:
    servers:
      - url: /
    post:
      operationId: adminRenewGmailWatch
      tags: [gmail]
      summary: Renew Gmail Watch through the protected admin route
      security:
        - automationBearer: []
      responses:
        "200":
          description: Watch renewed without resetting the history cursor
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  result:
                    $ref: "#/components/schemas/GmailWatch"
        "401":
          description: Invalid automation credential
        "503":
          description: Gmail watch could not be renewed; retry later
  /admin/activate-gmail-watch:
    servers:
      - url: /
    post:
      operationId: adminActivateGmailWatch
      tags: [gmail]
      summary: Activate Gmail Watch through the protected admin route
      security:
        - automationBearer: []
      responses:
        "200":
          description: Watch activated or renewed without resetting the history cursor
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  result:
                    $ref: "#/components/schemas/GmailWatch"
        "401":
          description: Invalid automation credential
        "503":
          description: Gmail watch could not be activated; retry later
  /gmail/watch:
    post:
      operationId: renewGmailWatch
      tags: [gmail]
      summary: Activate or renew the managed Gmail users.watch subscription
      security:
        - automationBearer: []
      responses:
        "200":
          description: Current durable Gmail history cursor and watch expiration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailWatch"
        "401":
          description: Invalid automation credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Gmail watch could not be activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gmail/recover-stored-threads:
    post:
      operationId: recoverStoredGmailThreads
      tags: [gmail]
      summary: Manually recover older or archived replies from stored outreach threads
      description: >
        Operator-only, read-only Gmail catch-up. Each call inspects at most five
        stored outreach threads, stages only message IDs, and drains at most
        twenty pending messages. Start with confirm alone. For each subsequent
        page pass both through and nextAfter from the preceding response as
        through and after. Repeat the final cursor while pending is true to
        drain staged messages; deferred failures may require a later retry.
        A failed request returns no new cursor; retry the same request.
      security:
        - automationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoredGmailRecoveryRequest"
      responses:
        "200":
          description: Bounded catch-up page and resumable cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredGmailRecoveryResult"
        "400":
          description: Explicit confirmation or cursor is invalid
        "401":
          description: Invalid automation credential
        "503":
          description: Recovery failed; replay the same page
  /gmail/push:
    post:
      operationId: receiveGmailPush
      tags: [gmail]
      summary: Receive an authenticated Google Cloud Pub/Sub Gmail notification
      security:
        - pubsubOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushEnvelope"
      responses:
        "204":
          description: Authenticated notification was accepted, duplicated, or permanently invalid
        "401":
          description: Invalid Pub/Sub OIDC identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: More than 50 authenticated pushes in 10 seconds per identity and server process; retry after the window
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: Temporary or incomplete processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restaurants/{placeId}/enrich:
    post:
      operationId: enrichRestaurant
      tags: [restaurants]
      summary: Enrich one restaurant from its public website
      security:
        - automationBearer: []
      parameters:
        - $ref: "#/components/parameters/PlaceId"
      responses:
        "200":
          description: Enrichment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantEnrichmentResult"
        "401":
          description: Invalid automation credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Restaurant cannot be enriched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/osm-candidates:
    get:
      operationId: listOsmCandidates
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: List OSM candidates for the admin workflow
      parameters:
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/OsmCandidateState"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Candidate page with durable workflow status and progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmCandidatePage" }
        "401":
          description: Admin login required
        "503":
          description: Candidate queue unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}:
    get:
      operationId: getOsmCandidate
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Read one candidate and its workflow record
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      responses:
        "200":
          description: Candidate details and workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmCandidateWorkflow" }
        "401": { description: Admin login required }
        "404":
          description: Candidate not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/review:
    post:
      operationId: reviewOsmCandidate
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Mark a candidate reviewed without verifying ownership or publishing
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      responses:
        "200":
          description: Candidate is now reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmCandidateWorkflow" }
        "401": { description: Admin login required }
        "409":
          description: Candidate cannot transition to reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/reject:
    post:
      operationId: suppressOsmCandidate
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Suppress a candidate permanently
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmSuppressionInput" }
      responses:
        "200":
          description: Candidate is terminally suppressed and unused claim tokens revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmCandidateWorkflow" }
        "401": { description: Admin login required }
        "409":
          description: Published candidates cannot be suppressed by this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/invites:
    post:
      operationId: sendOsmClaimInvite
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Reserve and send a claim invitation for a reviewed candidate
      description: Sends no invitation during ingestion. Caps invitations at three with at least seven days between provider-confirmed sends. SMS fails closed unless a sender is configured.
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmClaimInviteInput" }
      responses:
        "201":
          description: Invitation accepted by the configured provider; raw token is never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOutreachLog" }
        "400":
          description: Invalid destination or delivery method
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: Admin login required }
        "409":
          description: Candidate is ineligible, suppressed, already claimed, or at an invitation limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Sender is unconfigured or delivery outcome is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/invites/resend:
    post:
      operationId: resendOsmClaimInvite
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Send a new, single-use claim invitation subject to the same limits
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      responses:
        "201":
          description: New invitation accepted by the configured provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOutreachLog" }
        "401": { description: Admin login required }
        "409":
          description: Candidate is not invite-eligible or limits have been reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Sender is unconfigured or delivery outcome is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/evidence/decision:
    post:
      operationId: decideOsmCandidateEvidence
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Approve or reject submitted owner-identity or source-rights evidence
      description: Each evidence category requires an explicit admin decision. Contact-channel verification alone is not ownership proof.
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmEvidenceDecisionInput" }
      responses:
        "200":
          description: Evidence decision recorded with reviewer and timestamp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmCandidateWorkflow" }
        "401": { description: Admin login required }
        "409":
          description: Candidate is suppressed or published, or the current evidence submission is not pending and valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/outreach:
    put:
      operationId: setOsmCandidateOutreachBlocked
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Enable or block further claim invitation outreach
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmOutreachPreferenceInput" }
      responses:
        "200":
          description: Outreach preference saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmCandidateWorkflow" }
        "401": { description: Admin login required }
        "404": { description: Candidate not found }
  /dashboard/osm-candidates/{sourceName}/{sourceId}/outreach-logs:
    get:
      operationId: listOsmCandidateOutreachLogs
      tags: [osm-candidates]
      security: [{ adminSession: [] }]
      summary: Read delivery attempts without exposing raw claim tokens
      parameters:
        - $ref: "#/components/parameters/OsmSourceName"
        - $ref: "#/components/parameters/OsmSourceId"
      responses:
        "200":
          description: Private outreach delivery history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OsmOutreachLog" }
        "401": { description: Admin login required }
        "404": { description: Candidate not found }
  /claim/exchange:
    post:
      operationId: exchangeOsmClaimLink
      tags: [osm-candidates]
      summary: Exchange a one-use claim-link token for a scoped owner session
      description: The raw invitation token is accepted only in the request body, stored as a hash, consumed once, and never returned or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmClaimExchangeInput" }
      responses:
        "200":
          description: Scoped owner session and pre-activation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOwnerSessionResponse" }
        "400":
          description: Claim link is invalid, expired, used, or suppressed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { description: Too many claim-link attempts }
  /claim/request:
    post:
      operationId: requestOsmClaim
      tags: [osm-candidates]
      summary: Exchange a one-use OSM claim invitation for a scoped owner session
      description: Alias of POST /claim/exchange. This route is registered before the existing /claim/{id} routes.
      x-canonical-operation: exchangeOsmClaimLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmClaimExchangeInput" }
      responses:
        "200":
          description: Scoped owner session and pre-activation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOwnerSessionResponse" }
        "400":
          description: Claim link is invalid, expired, used, or suppressed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { description: Too many claim-link attempts }
  /claim/verify:
    post:
      operationId: verifyOsmClaimContact
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Submit a one-time code to verify the invited email channel
      description: Alias of POST /claim/verification-code/submit. Email possession is not ownership or source-rights proof.
      x-canonical-operation: submitOsmClaimVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmVerificationCodeInput" }
      responses:
        "200":
          description: Contact-channel verification status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmContactVerification" }
        "400":
          description: Invalid, expired, exhausted, or previously used code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: Valid owner session required }
  /claim/rights:
    post:
      operationId: submitOsmRightsEvidence
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Submit OSM source reuse-rights evidence for admin review
      description: Alias of PUT /claim/evidence. Submission alone does not approve source rights.
      x-canonical-operation: submitOsmClaimEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmClaimEvidenceInput" }
      responses:
        "200":
          description: Evidence submitted and awaiting admin decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmEvidenceSubmission" }
        "400": { description: Evidence or attribution is incomplete }
        "401": { description: Valid owner session required }
        "409": { description: Candidate is suppressed or already published }
  /claim/rights/confirm:
    post:
      operationId: confirmOsmRightsEvidence
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Confirm the submitted source-rights evidence for admin review
      description: Alias of PUT /claim/evidence and idempotent for an unchanged evidence submission; it does not set rightsConfirmed.
      x-canonical-operation: submitOsmClaimEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmClaimEvidenceInput" }
      responses:
        "200":
          description: Evidence submitted and awaiting admin decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmEvidenceSubmission" }
        "400": { description: Evidence or attribution is incomplete }
        "401": { description: Valid owner session required }
        "409": { description: Candidate is suppressed or already published }
  /claim/verify/request:
    post:
      operationId: requestOsmClaimVerificationCodeAlias
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Send a short-lived verification code to the invited email
      description: Alias of POST /claim/verification-code/request. SMS is not sent unless a configured sender is available.
      x-canonical-operation: requestOsmClaimVerificationCode
      responses:
        "202": { description: Verification request accepted without revealing whether an address exists }
        "401": { description: Valid owner session required }
        "429": { description: Verification code rate limit reached }
        "503":
          description: Email provider is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /claim/verify/submit:
    post:
      operationId: submitOsmClaimVerification
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Submit the one-time email verification code
      description: Alias of POST /claim/verification-code/submit.
      x-canonical-operation: submitOsmClaimVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmVerificationCodeInput" }
      responses:
        "200":
          description: Contact-channel verification status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmContactVerification" }
        "400": { description: "Invalid, expired, exhausted, or previously used code" }
        "401": { description: Valid owner session required }
  /claim/activate:
    post:
      operationId: activateOsmClaimListing
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Activate and publish the fully approved OSM candidate
      description: Alias of POST /owner/claim/activate; all server-side proof, completeness, suppression, and idempotency gates are identical.
      x-canonical-operation: activateOsmOwnerListing
      responses:
        "200":
          description: Current activation state and step progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmActivationProgress" }
        "401": { description: Valid owner session required }
        "409":
          description: Activation preconditions are not satisfied or candidate is terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Activation is incomplete and safely resumable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmActivationProgress" }
  /claim/verification-code/request:
    post:
      operationId: requestOsmClaimVerificationCode
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Send a short-lived email verification code to the invited address
      description: Verifies control of the invitation email only; it does not establish business ownership or source rights. Codes are hashed, rate limited, and never returned or logged.
      responses:
        "202": { description: Verification request accepted without revealing whether an address exists }
        "401": { description: Valid owner session required }
        "429": { description: Verification code rate limit reached }
        "503":
          description: Email provider is not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /claim/verification-code/submit:
    post:
      operationId: submitOsmClaimVerificationCode
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Verify the invited email address using a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmVerificationCodeInput" }
      responses:
        "200":
          description: Contact-channel verification status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmContactVerification" }
        "400":
          description: Invalid, expired, exhausted, or previously used code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: Valid owner session required }
  /claim/evidence:
    put:
      operationId: submitOsmClaimEvidence
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Submit ownership and OSM source-rights evidence for admin review
      description: Evidence is recorded separately for ownership and source reuse rights. Submission does not set either approval flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmClaimEvidenceInput" }
      responses:
        "200":
          description: Evidence submitted and awaiting admin decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmEvidenceSubmission" }
        "400":
          description: Evidence description or source attribution is incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { description: Valid owner session required }
        "409": { description: Candidate is suppressed or already published }
  /owner/claim/dashboard:
    get:
      operationId: getOsmOwnerDashboard
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Read the scoped pre-activation or activated owner dashboard
      responses:
        "200":
          description: Owner dashboard, draft, proof decisions, and activation progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOwnerDashboard" }
        "401": { description: Valid owner session required }
  /owner/claim/draft:
    patch:
      operationId: updateOsmOwnerDraft
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Edit owner-controlled candidate details without publishing them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmOwnerDraftInput" }
      responses:
        "200":
          description: Private draft and required-field completeness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOwnerDraft" }
        "400": { description: Invalid draft fields }
        "401": { description: Valid owner session required }
        "409": { description: Candidate is suppressed or published }
  /owner/claim/activate:
    post:
      operationId: activateOsmOwnerListing
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Run the resumable promotion, enrichment, scoring, and publication pipeline
      description: Server-side checks require review, claimed status, email-channel verification, admin-approved ownership and source-rights evidence, complete required fields, and no suppression. Duplicate requests resume the same activation; publication and candidate state commit atomically.
      responses:
        "200":
          description: Current activation state and step progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmActivationProgress" }
        "401": { description: Valid owner session required }
        "409":
          description: Activation preconditions are not satisfied or candidate is terminal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Activation is incomplete and safely resumable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmActivationProgress" }
  /owner/claim/analytics:
    get:
      operationId: getOsmOwnerAnalytics
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Read activated listing views, searches, and clicks
      description: Available only after publication. Views and searches count events explicitly recorded by server-side profile and search handlers; client-submitted analytics events are excluded. Clicks remain zero until a trusted server-side click signal is implemented.
      responses:
        "200":
          description: Lifetime and last-30-day metrics from trusted server-side event sources only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOwnerAnalytics" }
        "401": { description: Valid owner session required }
        "409": { description: Listing is not published }
  /owner/claim/outreach-preference:
    put:
      operationId: setOsmOwnerOutreachPreference
      tags: [osm-candidates]
      security: [{ ownerSession: [] }]
      summary: Disable or enable future claim outreach for the scoped listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OsmOwnerOutreachPreferenceInput" }
      responses:
        "200":
          description: Persisted owner outreach preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsmOwnerOutreachPreference" }
        "401": { description: Valid owner session required }
        "409": { description: Listing is not activated }
components:
  securitySchemes:
    automationBearer:
      type: http
      scheme: bearer
    adminSession:
      type: apiKey
      in: cookie
      name: tfa_admin
    ownerSession:
      type: http
      scheme: bearer
    pubsubOidc:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC ID token
  parameters:
    PlaceId:
      in: path
      name: placeId
      required: true
      schema:
        type: string
        minLength: 1
    OsmSourceName:
      in: path
      name: sourceName
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    OsmSourceId:
      in: path
      name: sourceId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
  schemas:
    OsmCandidateState:
      type: string
      enum: [unverified, reviewed, claim_invited, claim_verified, activated, published, suppressed]
    OsmEvidenceStatus:
      type: string
      enum: [not_submitted, pending, approved, rejected]
    OsmActivationStep:
      type: string
      enum: [promotion, enrichment, scoring, publication, finalization]
    OsmCandidate:
      type: object
      additionalProperties: false
      required: [sourceName, sourceId, name, address, phone, website, latitude, longitude, importedAt, state, reviewed, claimed, identityVerified, rightsConfirmed, published, suppressed, outreachBlocked, highConfidence, inviteCount, requiredFieldsComplete]
      properties:
        sourceName: { type: string }
        sourceId: { type: string }
        name: { type: string }
        address: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        importedAt: { type: string, format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
        state: { $ref: "#/components/schemas/OsmCandidateState" }
        reviewed: { type: boolean }
        claimed: { type: boolean }
        identityVerified: { type: boolean, description: Email channel ownership only; not business ownership proof. }
        rightsConfirmed: { type: boolean, description: True only after explicit admin approval of source reuse rights evidence. }
        published: { type: boolean }
        suppressed: { type: boolean }
        outreachBlocked: { type: boolean }
        highConfidence: { type: boolean }
        inviteCount: { type: integer, minimum: 0, maximum: 3 }
        requiredFieldsComplete: { type: boolean }
    OsmCandidateWorkflow:
      type: object
      additionalProperties: false
      required: [candidate, evidence, activation]
      properties:
        candidate: { $ref: "#/components/schemas/OsmCandidate" }
        evidence:
          type: object
          additionalProperties: false
          required: [ownershipStatus, rightsStatus, submittedAt, ownershipSubmission, sourceRightsSubmission]
          properties:
            ownershipStatus: { $ref: "#/components/schemas/OsmEvidenceStatus" }
            rightsStatus: { $ref: "#/components/schemas/OsmEvidenceStatus" }
            submittedAt: { type: ["string", "null"], format: date-time }
            ownershipSubmission:
              anyOf:
                - $ref: "#/components/schemas/OsmEvidenceRecord"
                - type: "null"
            sourceRightsSubmission:
              anyOf:
                - $ref: "#/components/schemas/OsmEvidenceRecord"
                - type: "null"
        activation: { $ref: "#/components/schemas/OsmActivationProgress" }
    OsmCandidatePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OsmCandidateWorkflow" }
        nextCursor: { type: ["string", "null"] }
    OsmSuppressionInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 1000 }
    OsmClaimInviteInput:
      type: object
      additionalProperties: false
      required: [sentTo, method]
      properties:
        sentTo:
          type: string
          maxLength: 254
          description: Email address, or a future explicitly configured channel address; provider-specific validation applies.
        method:
          type: string
          enum: [email, sms, outreach]
    OsmOutreachLog:
      type: object
      additionalProperties: false
      required: [id, sourceName, sourceId, sentTo, method, status, createdAt]
      properties:
        id: { type: string }
        sourceName: { type: string }
        sourceId: { type: string }
        sentTo: { type: ["string", "null"], description: Private contact data; admin-only response. }
        method: { type: string, enum: [email, sms, outreach] }
        status: { type: string, enum: [sent, failed, bounced, unknown] }
        createdAt: { type: string, format: date-time }
        errorCode: { type: ["string", "null"], description: Sanitized provider error category; never raw error text. }
    OsmEvidenceDecisionInput:
      type: object
      additionalProperties: false
      required: [kind, decision]
      properties:
        kind: { type: string, enum: [ownership, source_rights] }
        decision: { type: string, enum: [approved, rejected] }
        reviewerNote: { type: ["string", "null"], maxLength: 2000 }
    OsmEvidenceRecord:
      type: object
      additionalProperties: false
      description: Private evidence details returned only to authenticated administrators.
      required: [status, description, evidenceUrl, sourceAttribution, submittedAt, reviewedAt, reviewedBy, reviewerNote]
      properties:
        status: { $ref: "#/components/schemas/OsmEvidenceStatus" }
        description: { type: string }
        evidenceUrl: { type: ["string", "null"], format: uri }
        sourceAttribution: { type: ["string", "null"] }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reviewedBy: { type: ["string", "null"] }
        reviewerNote: { type: ["string", "null"] }
    OsmOutreachPreferenceInput:
      type: object
      additionalProperties: false
      required: [blocked]
      properties:
        blocked: { type: boolean }
    OsmClaimExchangeInput:
      type: object
      additionalProperties: false
      required: [claimToken]
      properties:
        claimToken: { type: string, minLength: 32, maxLength: 512 }
    OsmOwnerSessionResponse:
      type: object
      additionalProperties: false
      required: [ownerSession, expiresAt, dashboardMode, state]
      properties:
        ownerSession: { type: string, description: Returned once; server stores only a hash. }
        expiresAt: { type: string, format: date-time }
        dashboardMode: { type: string, enum: [pre_activation, activated] }
        state: { $ref: "#/components/schemas/OsmCandidateState" }
    OsmVerificationCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 10, pattern: "^[0-9]+$" }
    OsmContactVerification:
      type: object
      additionalProperties: false
      required: [identityVerified, state]
      properties:
        identityVerified: { type: boolean, description: Confirms control of the invitation email only. }
        state: { $ref: "#/components/schemas/OsmCandidateState" }
    OsmClaimEvidenceInput:
      type: object
      additionalProperties: false
      required: [ownershipDescription, rightsDescription, sourceAttribution]
      properties:
