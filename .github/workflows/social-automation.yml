name: Social automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

# Do not cancel an in-flight submission when the next clock tick arrives.
concurrency:
  group: social-automation
  cancel-in-progress: false

jobs:
  run:
    if: vars.SOCIAL_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run due social posts
        env:
          URL: ${{ vars.SOCIAL_AUTOMATION_URL }}
          TOKEN: ${{ secrets.SOCIAL_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "Social automation URL or token is not configured" >&2
            exit 1
          fi
          case "$URL" in
            https://*/api/automation/social) ;;
            *) echo "URL must be the HTTPS production social automation endpoint" >&2; exit 1 ;;
          esac
          curl --fail-with-body --show-error --silent \
            --request POST --header "Authorization: Bearer $TOKEN" \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --max-time 240 "$URL"