kind = "web"
previewPath = "/"
title = "the-food-advisor"
description = "A budget-aware restaurant discovery and import dashboard for expanding UK restaurant coverage across web and mobile without exceeding Google Places spending limits."
version = "1.0.0"
id = "artifacts/restaurant-advisor-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22612

[services.development]
run = "pnpm --filter restaurant-advisor-web exec vite --host 0.0.0.0 --port $PORT --strictPort"

[services.production]
build = [ "pnpm", "--filter", "restaurant-advisor-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/restaurant-advisor-web/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22612"
BASE_PATH = "/"
